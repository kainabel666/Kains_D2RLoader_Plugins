# auto-identify default config.
# D2RLoader writes this to d2rloader/config/auto-identify.toml if it is missing,
# then the plugin reads it. Changes take effect on the next game start.
#
# Items are identified when a player picks them up (to the cursor, inventory or
# cube), never when they drop. The host identifies the item and sends it to
# every client. In TCP/IP games host and clients need the same plugin version.

[auto-identify]
# Master switch.
enabled = true

# Item qualities that are identified on pickup. Names (case-insensitive):
#   inferior, normal, superior, magic, set, rare, unique, crafted, tempered
# Numbers 1-9 (the game's item quality ids) are accepted too.
# An empty list identifies nothing.
qualities = ["magic", "set", "rare", "unique", "crafted"]

# Item names (display only, on this PC). The name colour still shows the quality.
# true = magic items show only the base name, without prefix/suffix names
#        ("Short Sword" instead of "Jagged Short Sword of the Fox").
hide_magic_affixes = false
# true = rare items show only the base name, without the rareprefix/raresuffix
#        name line ("Grim Helm" instead of "Pain Visage / Grim Helm").
hide_rare_names = false
# Same as hide_rare_names, for crafted items (they use the same name tables).
hide_crafted_names = false
