trapdoors = [98, 9, 112, 182]
spawns = [7, 7, 117, 7, 77, 42, 152, 42, 42, 72, 152, 97, 7, 112, 122, 157, 147, 157, 147, 187, 87, 192]
bodies = [92, 12, 112, 17, 92, 37, 112, 37, 142, 47, 92, 57, 112, 62, 92, 77, 47, 82, 112, 82, 12, 92, 32, 92, 67, 92, 87, 97, 142, 102, 22, 112, 47, 112, 72, 112, 117, 112, 92, 122, 112, 142, 92, 147, 92, 167, 112, 172, 112, 192]

# Arena Tomb 2
[arena.level.139]
gates = [116, 69, 74, 74, 101, 118, 46, 26]
trapdoors = [26, 74, 96, 26]
spawns = [72, 7, 7, 37, 137, 42, 132, 97, 7, 107, 77, 137]
# extra spots for the duel start only (respawns use spawns); marked by the user 2026-11-08 with `arena where` (not read before 2.1.x)
start_spawns = [120, 23, 22, 64, 104, 123, 25, 118, 103, 30, 37, 32]
bodies = [77, 17, 47, 32, 97, 32, 117, 32, 67, 42, 92, 47, 77, 52, 52, 57, 117, 57, 32, 62, 102, 67, 47, 72, 77, 72, 32, 77, 117, 77, 82, 82, 52, 92, 117, 97, 67, 102, 87, 102, 47, 117, 62, 117, 97, 117, 117, 117, 77, 127]
